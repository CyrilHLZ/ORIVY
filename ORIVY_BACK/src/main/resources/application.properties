spring.application.name=demo
# 8080 est déjà pris par un conteneur Docker (designpulse) : ORIVY écoute sur 8081
server.port=8081
spring.datasource.url=jdbc:h2:file:./data/orivy;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Renvoie au front le message des ResponseStatusException
server.error.include-stacktrace=never

# Secret lu dans ORIVY_BACK/.env (non versionné) ou dans la variable d'environnement
spring.config.import=optional:file:.env[.properties]
orivy.jwt.secret=${ORIVY_JWT_SECRET}
orivy.jwt.duree-heures=24

