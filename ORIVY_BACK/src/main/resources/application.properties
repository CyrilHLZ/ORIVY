spring.application.name=orivy
# 8080 est déjà pris par un conteneur Docker (designpulse) : ORIVY écoute sur 8081
server.port=8081
# Base de données : PostgreSQL si .env donne ORIVY_DB_URL (dev et prod), sinon l'ancienne base H2 (fichier)
spring.datasource.url=${ORIVY_DB_URL:jdbc:h2:file:./data/orivy;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.username=${ORIVY_DB_USER:sa}
spring.datasource.password=${ORIVY_DB_PASSWORD:}
# La structure de la base vient de Flyway (db/migration) ; Hibernate vérifie seulement qu'elle colle aux classes
spring.jpa.hibernate.ddl-auto=validate
# Ta base de dev a déjà ses tables (créées par Hibernate) : Flyway note V1 comme « faite » sans la rejouer.
# Une base vide (en ligne) jouera V1 normalement.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Renvoie au front le message des ResponseStatusException
server.error.include-stacktrace=never

# Secret lu dans ORIVY_BACK/.env (non versionné) ou dans la variable d'environnement
spring.config.import=optional:file:.env[.properties]
orivy.jwt.secret=${ORIVY_JWT_SECRET}
orivy.jwt.duree-heures=24


# Compte administrateur créé au démarrage s'il n'existe pas (CompteAdminInitializer), lu dans .env
orivy.admin.email=${ORIVY_ADMIN_EMAIL:}
orivy.admin.mot-de-passe=${ORIVY_ADMIN_MOT_DE_PASSE:}

# Photos et vidéos envoyées par les membres : dossier, et 50 Mo au maximum
# (les photos sont limitées à 2 Mo par FichierService)
orivy.dossier-uploads=uploads

# Front autorisé à appeler l'API (CORS). Dev : tous les ports de localhost (5173, 5174…)
orivy.cors.origines=http://localhost:*
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# Monuments historiques (base Mérimée, ministère de la Culture) : fichier public, sans clé
orivy.monuments-historiques.url=https://ministere-culture.s3.sbg.io.cloud.ovh.net/POP/merimee.csv
# Musées de France (base Muséofile, ministère de la Culture) : fichier public, sans clé
orivy.musees-de-france.url=https://ministere-culture.s3.sbg.io.cloud.ovh.net/POP/museofile.csv
