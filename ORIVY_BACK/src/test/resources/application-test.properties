# Réglages des TESTS (profil "test", activé par @ActiveProfiles("test")).
# Ils remplacent ceux de application.properties et de .env : les tests ne touchent JAMAIS ta vraie base.

# Base jetable, en mémoire : créée au début des tests, effacée à la fin
spring.datasource.url=jdbc:h2:mem:orivy-tests;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Flyway est vérifié sur PostgreSQL (V1 joué sur une base vide) ; ici Hibernate crée les tables
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Clé de signature des jetons RÉSERVÉE aux tests (aucune valeur en commun avec .env)
orivy.jwt.secret=UNT1JKMdgjI0f25/jGsU+4GLRAzKp4v5WzN1PClyWyQ=
# Pas de compte admin créé au démarrage des tests
orivy.admin.email=
orivy.admin.mot-de-passe=
# Les fichiers envoyés pendant les tests vont dans target/ (effacé par mvn clean)
orivy.dossier-uploads=target/uploads-tests
# Pas d'import OpenStreetMap (Internet) pendant les tests
orivy.osm.import-auto=false
