<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" aria-hidden="true">
  <!--
    Restaurant : bistrot parisien, auvent rayé, tables en terrasse, enseigne néon « Chez Orivy ».
    Couleur de catégorie #f4a259 : rayures de l'auvent.
    Animation (> 480px, sans mouvement réduit) : #neon s'allume doucement (3 s) puis respire.
  -->
  <style>
    @media (min-width: 480px) and (prefers-reduced-motion: no-preference) {
      #neon { animation: allumage 3s ease-out both, respire 4s 3s ease-in-out infinite alternate; }
      @keyframes allumage { 0% { opacity: .15; } 60% { opacity: .5; } 100% { opacity: 1; } }
      @keyframes respire { from { opacity: 1; } to { opacity: .85; } }
    }
  </style>
  <rect width="800" height="600" fill="#F4E9D8"/>
  <!-- Façade -->
  <g stroke="#1F1915" stroke-width="3" stroke-linejoin="round">
    <rect x="80" y="60" width="640" height="460" fill="#EADBC3"/>
    <rect x="80" y="210" width="640" height="310" fill="#2F4F45"/>
    <rect x="120" y="290" width="200" height="200" fill="#F6D9A0"/>
    <rect x="480" y="290" width="200" height="200" fill="#F6D9A0"/>
    <rect x="350" y="290" width="100" height="230" fill="#7A5A44"/>
    <path d="M220 290 v200 M580 290 v200 M120 390 h200 M480 390 h200" fill="none"/>
    <rect x="150" y="90" width="90" height="90" fill="#3E4A52"/><rect x="355" y="90" width="90" height="90" fill="#3E4A52"/><rect x="560" y="90" width="90" height="90" fill="#3E4A52"/>
  </g>
  <!-- Auvent rayé -->
  <g stroke="#1F1915" stroke-width="3" stroke-linejoin="round">
    <path d="M60 240 H740 L770 300 H30 Z" fill="#FFFBF6"/>
    <path d="M60 240 h56 L100 300 H30 Z M172 240 h56 L222 300 h-56 Z M284 240 h56 L344 300 h-56 Z M396 240 h56 L466 300 h-56 Z M508 240 h56 L588 300 h-56 Z M620 240 h56 L710 300 h-56 Z" fill="#f4a259"/>
    <path d="M30 300 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 q20 22 40 0 z" fill="#f4a259"/>
  </g>
  <!-- Trottoir -->
  <rect y="520" width="800" height="80" fill="#D9C2A0" stroke="#1F1915" stroke-width="3"/>
  <!-- Tables et chaises bistrot -->
  <g stroke="#1F1915" stroke-width="3.5" stroke-linecap="round" fill="none">
    <ellipse cx="190" cy="500" rx="46" ry="10" fill="#E2D3BC"/><path d="M190 510 v50 M170 560 h40"/>
    <path d="M120 470 v90 M120 520 h30 v40 M120 470 q-10 -12 0 -20"/>
    <path d="M260 470 v90 M260 520 h-30 v40 M260 470 q10 -12 0 -20"/>
    <ellipse cx="610" cy="500" rx="46" ry="10" fill="#E2D3BC"/><path d="M610 510 v50 M590 560 h40"/>
    <path d="M540 470 v90 M540 520 h30 v40 M540 470 q-10 -12 0 -20"/>
    <path d="M680 470 v90 M680 520 h-30 v40 M680 470 q10 -12 0 -20"/>
  </g>
  <g stroke="#1F1915" stroke-width="2.5"><path d="M180 492 v-14 h8 v14 M600 492 v-14 h8 v14" fill="#B5527A"/></g>
  <!-- Enseigne néon -->
  <g id="neon">
    <rect x="250" y="190" width="300" height="46" rx="10" fill="#2E2622" stroke="#1F1915" stroke-width="3"/>
    <text x="400" y="224" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="none" stroke="#FFB55E" stroke-width="7" opacity=".35">Chez Orivy</text>
    <text x="400" y="224" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#FFF1D6" stroke="#FFB55E" stroke-width="1.5">Chez Orivy</text>
  </g>
</svg>
