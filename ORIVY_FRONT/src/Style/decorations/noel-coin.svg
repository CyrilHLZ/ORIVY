    <path d="M52 6 V38 M70 8 V55 M86 4 V29"/>
  </g>
  <g id="sapin" stroke="#2F6B4A" stroke-linecap="round">
    <path d="M96 3 C82 6 66 6 46 4" fill="none" stroke-width="3"/>
    <path d="M90 4 l-4 6 M80 5 l-3 6 M70 5 l-3 6 M60 5 l-3 6 M52 4 l-3 6 M85 4 l3 6 M75 5 l3 6 M65 5 l3 6 M56 4 l3 6" stroke-width="2"/>
  </g>
  <g id="boules" stroke-width="1.2">
