    <circle cx="70" cy="64" r="9" fill="#2F7A55" stroke="#1E513A"/>
    <circle cx="86" cy="36" r="7" fill="#E0B04A" stroke="#9C7426"/>
  </g>
  <g fill="#FFFFFF" opacity=".55">
    <circle cx="49" cy="43" r="1.8"/><circle cx="67" cy="60" r="2"/><circle cx="84" cy="33" r="1.5"/>
  </g>
</svg>
