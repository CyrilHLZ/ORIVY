<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96" aria-hidden="true">
  <!-- Coin du printemps : une branche de cerisier qui entre par le coin haut droit. -->
  <defs>
    <g id="fleur">
      <g fill="#F2A7B5" stroke="#C9707F" stroke-width="1">
        <ellipse cx="12" cy="6.5" rx="3.6" ry="4.5"/>
        <ellipse cx="12" cy="6.5" rx="3.6" ry="4.5" transform="rotate(72 12 12)"/>
        <ellipse cx="12" cy="6.5" rx="3.6" ry="4.5" transform="rotate(144 12 12)"/>
        <ellipse cx="12" cy="6.5" rx="3.6" ry="4.5" transform="rotate(216 12 12)"/>
        <ellipse cx="12" cy="6.5" rx="3.6" ry="4.5" transform="rotate(288 12 12)"/>
      </g>
      <circle cx="12" cy="12" r="2.4" fill="#E8B04A"/>
    </g>
  </defs>
  <path id="branche" d="M96 4 C78 10 62 22 40 26 M70 15 C66 26 60 34 52 40 M56 22 C50 18 44 18 38 16" fill="none" stroke="#7A5A44" stroke-width="3" stroke-linecap="round"/>
  <g id="feuilles" fill="#7FB069" stroke="#4F7A3E" stroke-width="1">
