<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon ORIVY : épingle crème sur pavé terracotta.
    Aux tailles d'onglet (16 à 32px), les points du sentier disparaîtraient : on garde l'épingle seule.
    Couleurs fixes (un favicon ne lit pas les variables CSS de la page).
  -->
  <rect width="32" height="32" rx="8" fill="#A34E2C"/>
  <path fill="none" stroke="#FFFBF6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
        d="M16 26 L10.4 16.3 A6.5 6.5 0 1 1 21.6 16.3 Z"/>
</svg>
