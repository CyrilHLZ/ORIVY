<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" aria-hidden="true">
  <!--
    Monument : château sur sa colline, pont de pierre sur la rivière, oiseaux qui passent.
    Couleur de catégorie #ef6f61 : toits coniques et fanions.
    Animation (> 480px, sans mouvement réduit) : #oiseaux traversent en 18 s, #fanions ondulent.
  -->
  <style>
    @media (min-width: 480px) and (prefers-reduced-motion: no-preference) {
      #oiseaux { animation: vol 18s linear infinite; }
      .fanion { transform-box: fill-box; transform-origin: left center; animation: flotte 2.4s ease-in-out infinite alternate; }
      @keyframes vol { from { transform: translate(-200px, 30px); } to { transform: translate(950px, -40px); } }
      @keyframes flotte { from { transform: skewY(-6deg); } to { transform: skewY(6deg); } }
    }
  </style>
  <rect width="800" height="600" fill="#F4E9D8"/>
  <circle cx="640" cy="120" r="54" fill="#F6CF7A" stroke="#1F1915" stroke-width="3"/>
  <g id="oiseaux" fill="none" stroke="#1F1915" stroke-width="3" stroke-linecap="round">
    <path d="M0 80 q9 -9 18 0 q9 -9 18 0"/><path d="M40 100 q7 -7 14 0 q7 -7 14 0"/><path d="M20 55 q6 -6 12 0 q6 -6 12 0"/>
  </g>
  <!-- Colline -->
  <path d="M0 400 C150 330 300 300 420 310 C560 320 680 360 800 350 V600 H0 Z" fill="#9DB37E" stroke="#1F1915" stroke-width="3"/>
  <!-- Château -->
  <g stroke="#1F1915" stroke-width="3" stroke-linejoin="round">
    <rect x="300" y="200" width="200" height="130" fill="#E2D3BC"/>
    <path d="M300 200 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14" fill="#E2D3BC"/>
    <rect x="260" y="170" width="56" height="160" fill="#E2D3BC"/>
    <rect x="484" y="170" width="56" height="160" fill="#E2D3BC"/>
    <rect x="370" y="130" width="60" height="200" fill="#E2D3BC"/>
    <path d="M254 172 L288 96 L322 172 Z" fill="#ef6f61"/>
    <path d="M478 172 L512 96 L546 172 Z" fill="#ef6f61"/>
    <path d="M362 132 L400 50 L438 132 Z" fill="#ef6f61"/>
    <path d="M380 330 v-44 a20 20 0 0 1 40 0 v44" fill="#8A6448"/>
    <rect x="278" y="210" width="20" height="30" rx="10" fill="#3E4A52"/>
    <rect x="502" y="210" width="20" height="30" rx="10" fill="#3E4A52"/>
    <rect x="390" y="160" width="20" height="30" rx="10" fill="#3E4A52"/>
    <rect x="330" y="240" width="18" height="26" rx="9" fill="#3E4A52"/>
    <rect x="452" y="240" width="18" height="26" rx="9" fill="#3E4A52"/>
  </g>
  <g stroke="#1F1915" stroke-width="3" stroke-linecap="round">
    <path d="M400 50 v-28 M288 96 v-22 M512 96 v-22"/>
    <path class="fanion" d="M400 22 l26 7 l-26 7 z" fill="#ef6f61"/>
    <path class="fanion" d="M288 74 l20 6 l-20 6 z" fill="#ef6f61"/>
    <path class="fanion" d="M512 74 l20 6 l-20 6 z" fill="#ef6f61"/>
  </g>
  <!-- Rivière -->
  <path d="M0 470 C200 450 600 450 800 470 V600 H0 Z" fill="#9CC3CF" stroke="#1F1915" stroke-width="3"/>
  <path d="M80 540 h70 M300 560 h90 M560 535 h80 M680 575 h60" stroke="#FFFBF6" stroke-width="3" stroke-linecap="round"/>
  <!-- Pont de pierre à trois arches -->
  <path d="M60 430 H740 V470 H690 A50 50 0 0 0 590 470 H520 A60 60 0 0 0 400 470 H330 A50 50 0 0 0 230 470 H160 A50 50 0 0 0 60 470 Z" fill="#CDB99B" stroke="#1F1915" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 430 h680" stroke="#1F1915" stroke-width="3"/>
  <path d="M60 418 h680 v12 h-680 z" fill="#E2D3BC" stroke="#1F1915" stroke-width="3"/>
  <path d="M110 445 h30 M260 445 h40 M440 445 h40 M610 445 h40" stroke="#1F1915" stroke-width="2" stroke-linecap="round" opacity=".5"/>
</svg>
