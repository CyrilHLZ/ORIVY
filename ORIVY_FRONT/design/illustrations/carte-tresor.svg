<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!--
    Connexion / inscription : une carte au trésor sur parchemin.
    Le sentier en pointillés (rappel du logo) part du village, passe par le château
    et la forêt, et mène à l'épingle ORIVY, posée sur le X du trésor.
    Les éléments importants restent dans les 3/4 du haut : le bas est couvert
    par la citation « Découvre. Vis. Profite. » sur la page.
    Animation (> 480px de large, sans mouvement réduit) — transform uniquement :
      #epingle flotte (2,4 s) · #aiguille oscille (6 s) · #bateau tangue (5 s) · .vague ondule (3 s).
  -->
  <style>
    @media (min-width: 480px) and (prefers-reduced-motion: no-preference) {
      #epingle { animation: flotte 2.4s ease-in-out infinite alternate; }
      #aiguille { transform-box: fill-box; transform-origin: 50% 50%; animation: oscille 6s ease-in-out infinite alternate; }
      #bateau { transform-box: fill-box; transform-origin: 50% 100%; animation: tangue 5s ease-in-out infinite alternate; }
      .vague { animation: ondule 3s ease-in-out infinite alternate; }
      /* (83) le sentier se dessine du drapeau jusqu'au trésor, puis recommence */
      #masque-sentier rect { transform-box: fill-box; transform-origin: 50% 100%; animation: dessine 6s ease-in-out infinite; }
      @keyframes dessine { 0% { transform: scaleY(0); } 55%, 90% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }
      .vague:nth-child(2n) { animation-delay: -1.5s; }
      @keyframes flotte { from { transform: translateY(0); } to { transform: translateY(-10px); } }
      @keyframes oscille { from { transform: rotate(-12deg); } to { transform: rotate(10deg); } }
      @keyframes tangue { from { transform: translateX(-8px) rotate(-4deg); } to { transform: translateX(10px) rotate(4deg); } }
      @keyframes ondule { from { transform: translateX(-5px); } to { transform: translateX(5px); } }
    }
  </style>

  <!-- La table en bois sous la carte -->
  <rect width="800" height="1000" fill="#C9A57A"/>
  <g stroke="#B08C62" stroke-width="3" opacity=".6">
    <path d="M0 180 H800 M0 420 H800 M0 660 H800 M0 900 H800"/>
  </g>

  <!-- Le parchemin, bords irréguliers -->
  <path d="M60 90 L140 84 L230 92 L330 86 L430 94 L540 85 L640 92 L740 88
           L748 190 L742 300 L750 420 L744 540 L751 660 L743 780 L748 912
           L650 918 L540 910 L430 919 L320 911 L210 918 L110 910 L56 914
           L62 800 L54 680 L61 560 L53 440 L60 320 L54 200 Z"
        fill="#F1E4C6" stroke="#1F1915" stroke-width="4" stroke-linejoin="round"/>
  <!-- Taches du temps -->
  <g fill="#E3CFA6" opacity=".7">
    <ellipse cx="660" cy="780" rx="70" ry="40"/>
    <ellipse cx="300" cy="200" rx="50" ry="30"/>
    <ellipse cx="520" cy="860" rx="40" ry="20"/>
  </g>

  <!-- La mer, sur le côté gauche -->
  <path d="M58 92 L232 92 C204 170 252 240 214 320 C176 400 244 470 204 560 C164 650 232 720 194 820 C178 862 200 892 210 912 L58 912 Z"
        fill="#B8D3D6"/>
  <path d="M232 92 C204 170 252 240 214 320 C176 400 244 470 204 560 C164 650 232 720 194 820 C178 862 200 892 210 912"
        fill="none" stroke="#1F1915" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#5E8C96" stroke-width="3" stroke-linecap="round">
    <path class="vague" d="M80 340 q10 -10 20 0 q10 -10 20 0"/>
    <path class="vague" d="M120 420 q10 -10 20 0 q10 -10 20 0"/>
    <path class="vague" d="M76 500 q10 -10 20 0 q10 -10 20 0"/>
    <path class="vague" d="M130 720 q10 -10 20 0 q10 -10 20 0"/>
    <path class="vague" d="M84 820 q10 -10 20 0 q10 -10 20 0"/>
  </g>

  <!-- La rose des vents, en mer -->
  <g transform="translate(140 205)">
    <circle r="56" fill="#F1E4C6" stroke="#1F1915" stroke-width="3"/>
    <circle r="44" fill="none" stroke="#1F1915" stroke-width="1.5" stroke-dasharray="3 5"/>
    <g id="aiguille">
      <path d="M0 -40 L9 0 L0 40 L-9 0 Z" fill="#F1E4C6" stroke="#1F1915" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M0 -40 L9 0 L-9 0 Z" fill="#A34E2C" stroke="#1F1915" stroke-width="2.5" stroke-linejoin="round"/>
      <circle r="4" fill="#1F1915"/>
    </g>
    <text y="-62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#1F1915">N</text>
  </g>

  <!-- Un petit voilier -->
  <g id="bateau">
    <path d="M86 615 H154 L142 635 H98 Z" fill="#8A6448" stroke="#1F1915" stroke-width="3" stroke-linejoin="round"/>
    <path d="M120 615 V560" stroke="#1F1915" stroke-width="3"/>
    <path d="M120 562 L150 608 H120 Z" fill="#FFFBF6" stroke="#1F1915" stroke-width="3" stroke-linejoin="round"/>
    <path d="M120 570 L98 608 H120 Z" fill="#E7A6A0" stroke="#1F1915" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- La rivière, des montagnes jusqu'à la mer (contour d'encre + eau) -->
  <path d="M630 300 C600 380 520 400 500 460 C480 520 380 520 330 580 C290 630 250 660 212 700"
        fill="none" stroke="#1F1915" stroke-width="17" stroke-linecap="round"/>
  <path d="M630 300 C600 380 520 400 500 460 C480 520 380 520 330 580 C290 630 250 660 212 700"
        fill="none" stroke="#9CC3CF" stroke-width="11" stroke-linecap="round"/>

  <!-- Les montagnes -->
  <g stroke="#1F1915" stroke-width="4" stroke-linejoin="round">
    <path d="M380 300 L440 205 L500 300 Z" fill="#9DB37E"/>
    <path d="M550 300 L640 135 L730 300 Z" fill="#B9C6A3"/>
    <path d="M450 300 L530 165 L610 300 Z" fill="#B9C6A3"/>
    <path d="M640 135 L666 183 L650 180 L640 192 L628 180 L614 183 Z" fill="#FFFBF6"/>
    <path d="M530 165 L552 203 L538 200 L530 210 L520 200 L508 203 Z" fill="#FFFBF6"/>
  </g>

  <!-- Le lac -->
  <ellipse cx="330" cy="390" rx="62" ry="30" fill="#9CC3CF" stroke="#1F1915" stroke-width="4"/>
  <path d="M300 385 h24 M340 397 h20" stroke="#FFFBF6" stroke-width="3" stroke-linecap="round"/>

  <!-- La forêt de sapins (le sentier la longe par la gauche) -->
  <g transform="translate(24 0)" fill="#3E5A44" stroke="#1F1915" stroke-width="3" stroke-linejoin="round">
    <path d="M630 520 l20 -56 l20 56 z"/><path d="M670 510 l18 -50 l18 50 z"/>
    <path d="M610 470 l16 -44 l16 44 z"/><path d="M690 455 l15 -42 l15 42 z"/>
    <path d="M650 445 l14 -38 l14 38 z"/><path d="M700 530 l16 -44 l16 44 z"/>
  </g>

  <!-- Le château (couleur « monument ») : le sentier passe devant sa porte -->
  <g transform="translate(-86 14)" stroke="#1F1915" stroke-width="3" stroke-linejoin="round">
    <rect x="530" y="590" width="64" height="44" fill="#E2D3BC"/>
    <rect x="518" y="574" width="20" height="60" fill="#E2D3BC"/>
    <rect x="586" y="574" width="20" height="60" fill="#E2D3BC"/>
    <path d="M515 576 L528 548 L541 576 Z M583 576 L596 548 L609 576 Z" fill="#ef6f61"/>
    <path d="M552 634 v-16 a10 10 0 0 1 20 0 v16" fill="#8A6448"/>
  </g>

  <!-- Le village (couleur « village ») -->
  <g stroke="#1F1915" stroke-width="3" stroke-linejoin="round">
    <rect x="262" y="690" width="34" height="30" fill="#E2D3BC"/>
    <path d="M258 692 L279 670 L300 692 Z" fill="#c98a3c"/>
    <rect x="304" y="700" width="30" height="26" fill="#E2D3BC"/>
    <path d="M300 702 L319 682 L338 702 Z" fill="#c98a3c"/>
    <rect x="284" y="728" width="28" height="24" fill="#E2D3BC"/>
    <path d="M280 730 L298 712 L316 730 Z" fill="#c98a3c"/>
  </g>

  <!-- Le sentier en pointillés : du drapeau de départ jusqu'au trésor.
       Un masque (rectangle qui grandit depuis le bas) le révèle peu à peu. -->
  <mask id="masque-sentier" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="1000">
    <rect x="300" y="320" width="340" height="470" fill="#FFFFFF"/>
  </mask>
  <path d="M392 772 C340 770 330 740 350 712 C380 672 470 668 520 640 C570 612 596 574 598 524 C600 470 588 438 556 410 C526 386 488 378 470 352"
        fill="none" stroke="#1F1915" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 22" mask="url(#masque-sentier)"/>
  <!-- Le départ : un petit drapeau -->
  <g stroke="#1F1915" stroke-width="3" stroke-linejoin="round">
    <path d="M398 778 V738" fill="none"/>
    <path d="M398 740 L424 748 L398 758 Z" fill="#6E8F5F"/>
  </g>

  <!-- Le trésor : un X à l'encre, et l'épingle ORIVY qui flotte au-dessus -->
  <path d="M452 340 L488 370 M488 340 L452 370" stroke="#A34E2C" stroke-width="7" stroke-linecap="round"/>
  <g id="epingle">
    <path d="M470 330 L446 290 A28 28 0 1 1 494 290 Z" fill="#FFFBF6" stroke="#A34E2C" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- Les rouleaux du parchemin, en haut et en bas -->
  <g stroke="#1F1915" stroke-width="4" stroke-linejoin="round">
    <rect x="38" y="62" width="724" height="40" rx="20" fill="#E3CFA6"/>
    <rect x="38" y="896" width="724" height="40" rx="20" fill="#E3CFA6"/>
  </g>
  <g fill="none" stroke="#B89A6C" stroke-width="2.5">
    <path d="M60 82 H740 M60 916 H740"/>
  </g>
</svg>
