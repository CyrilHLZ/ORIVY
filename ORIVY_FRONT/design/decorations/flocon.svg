    <g id="branche">
      <path d="M12 2 V22 M9 4.5 L12 7 L15 4.5 M9 19.5 L12 17 L15 19.5"/>
    </g>
    <use href="#branche" transform="rotate(60 12 12)"/>
    <use href="#branche" transform="rotate(120 12 12)"/>
  </g>
</svg>
