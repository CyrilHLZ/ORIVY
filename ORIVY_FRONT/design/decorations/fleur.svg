    <ellipse cx="12" cy="6.5" rx="3.6" ry="4.5" transform="rotate(144 12 12)"/>
    <ellipse cx="12" cy="6.5" rx="3.6" ry="4.5" transform="rotate(216 12 12)"/>
    <ellipse cx="12" cy="6.5" rx="3.6" ry="4.5" transform="rotate(288 12 12)"/>
  </g>
  <circle cx="12" cy="12" r="2.4" fill="#E8B04A"/>
