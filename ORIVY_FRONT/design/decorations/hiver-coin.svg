<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96" aria-hidden="true">
  <!-- Coin de l'hiver : trois flocons de tailles différentes. -->
  <defs>
    <g id="branche"><path d="M12 2 V22 M9 4.5 L12 7 L15 4.5 M9 19.5 L12 17 L15 19.5"/></g>
    <g id="flocon" fill="none" stroke="#7FB2D1" stroke-width="1.8" stroke-linecap="round">
      <use href="#branche" xlink:href="#branche"/>
      <use href="#branche" xlink:href="#branche" transform="rotate(60 12 12)"/>
      <use href="#branche" xlink:href="#branche" transform="rotate(120 12 12)"/>
    </g>
  </defs>
  <use href="#flocon" xlink:href="#flocon" transform="translate(58 4) scale(1.5)"/>
  <use href="#flocon" xlink:href="#flocon" transform="translate(34 34)"/>
  <use href="#flocon" xlink:href="#flocon" transform="translate(74 50) scale(.75)"/>
</svg>
